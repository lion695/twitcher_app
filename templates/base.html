{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Twitcher App{% endblock %}</title>

    <!-- Bootstrap 5.3.3 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Custom Project Theme CSS Stylesheet -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Accessible Semantic Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm mb-4" role="navigation">

    <div class="container">

        <a class="navbar-brand fw-bold d-flex align-items-center" href="{% url 'home' %}">
            <i class="fa-solid fa-eagle me-2"></i>
            Twitcher App
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav ms-auto align-items-center mb-2 mb-lg-0">

                <li class="nav-item">
                    <!-- Dynamic validation active cue for home path -->
                    <a class="nav-link px-3 {% if request.path == '/' %}active fw-bold{% endif %}" href="{% url 'home' %}">
                        <i class="fa-solid fa-house me-1"></i>
                        Home Feed
                    </a>
                </li>

                <!-- NEW ADDITION: About Me Page Nav Link (LO1.1 Compliance) -->
                <li class="nav-item">
                    <!-- Evaluates request path to inject standard Bootstrap active highlight styling -->
                    <a class="nav-link px-3 {% if '/about/' in request.path %}active fw-bold{% endif %}" href="/about/">
                        <i class="fa-solid fa-circle-info me-1"></i>
                        About
                    </a>
                </li>

                {% if user.is_authenticated %}

                <li class="nav-item">
                    <a class="nav-link text-warning px-3" href="#">
                        <i class="fa-solid fa-circle-plus me-1"></i>
                        Log Sighting
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link px-3" href="/admin/">
                        <i class="fa-solid fa-user-shield me-1"></i>
                        Dashboard
                    </a>
                </li>

                {% endif %}

            </ul>

        </div>

    </div>

</nav>


    <!-- Main Content -->
    <main class="container flex-grow-1">

        {% block content %}
        <!-- Child template HTML layouts inject here -->
        {% endblock %}

    </main>

    <!-- Accessible Semantic Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-4">

        <div class="container">

            <p class="mb-0 small">
                &copy; {% now "Y" %} Twitcher App -
                Built by Kieron Rostill-Fellows.
            </p>

        </div>

    </footer>

    <!-- Bootstrap 5.3.3 Bundle with Popper -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Custom Core Application JavaScript Tracking Pipeline (LO1.1) -->
    <script src="{% static 'js/script.js' %}"></script>

</body>

</html>
